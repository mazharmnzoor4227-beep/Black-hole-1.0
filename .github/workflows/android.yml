name: Android APK and device verification
on:
  push:
    branches: [main, 'build/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Backend policy tests
        run: python3 -m unittest discover -s backend -v
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: black-hole-debug-signing-v1
      - name: Compile and lint
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: APK metadata and ABI validation
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/BLACK-HOLE-1.1.2-direct.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging artifacts/BLACK-HOLE-1.1.2-direct.apk > artifacts/apk-metadata.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifacts/BLACK-HOLE-1.1.2-direct.apk > artifacts/signature.txt
          python3 - <<'PY'
          import os,zipfile,hashlib,json
          p='artifacts/BLACK-HOLE-1.1.2-direct.apk'
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              for abi in ('arm64-v8a','armeabi-v7a','x86','x86_64'):
                  assert any(n.startswith('lib/'+abi+'/') for n in names), 'Missing native ABI '+abi
          metadata=open('artifacts/apk-metadata.txt').read()
          assert "sdkVersion:'28'" in metadata
          assert "targetSdkVersion:'36'" in metadata
          assert "launchable-activity: name='com.blackhole.app.MainActivity'" in metadata
          assert os.path.getsize(p) < 260*1024*1024
          json.dump({'bytes':os.path.getsize(p),'sha256':hashlib.sha256(open(p,'rb').read()).hexdigest(),'commit':os.environ['GITHUB_SHA'],'download_engine':'on-device yt-dlp + FFmpeg'},open('artifacts/build.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: BLACK-HOLE-1.1.2-direct-APK
          path: artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-inputs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/
  device-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [28, 29, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-test-inputs
          path: test-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create real video fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          mkdir -p fixture evidence
          ffmpeg -f lavfi -i testsrc=size=320x240:rate=15 -f lavfi -i sine=frequency=440 -t 4 -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart fixture/fixture.mp4
          (cd fixture && python3 ../scripts/fixture_server.py) &
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: false
          script: |
            adb install test-apks/debug/app-debug.apk
            adb install test-apks/androidTest/debug/app-debug-androidTest.apk
            if [ "${{ matrix.api }}" = "28" ]; then adb shell pm grant com.blackhole.app android.permission.WRITE_EXTERNAL_STORAGE; adb shell pm grant com.blackhole.app android.permission.READ_EXTERNAL_STORAGE; fi
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb shell am instrument -w com.blackhole.app.test/androidx.test.runner.AndroidJUnitRunner | tee evidence/instrumentation.txt
            adb pull /sdcard/Android/data/com.blackhole.app/files/evidence evidence/screenshots || true
            adb logcat -d -s AndroidRuntime > evidence/runtime.txt
            python3 -c 's=open("evidence/instrumentation.txt").read(); assert "OK (" in s and "FAILURES" not in s, s'
            if [ "${{ matrix.api }}" = "36" ]; then timeout 300 adb shell am instrument -w -e class com.blackhole.app.SocialDownloadTest -e liveUrl https://vt.tiktok.com/ZSqKosxuo/ com.blackhole.app.test/androidx.test.runner.AndroidJUnitRunner | tee evidence/live-instrumentation.txt; fi
            adb pull /sdcard/Android/data/com.blackhole.app/files/evidence evidence/live || true
            if [ "${{ matrix.api }}" = "36" ]; then python3 -c 's=open("evidence/live-instrumentation.txt").read(); assert "OK (" in s and "FAILURES" not in s, s'; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-evidence-api-${{ matrix.api }}
          path: evidence/
